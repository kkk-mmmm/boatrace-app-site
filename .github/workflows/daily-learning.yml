          key: daily-evaluation-06-${{ github.run_id }}
          restore-keys: site-v2-06-${{ steps.day.outputs.date }}-
      - uses: actions/cache/restore@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          path: site/cache/${{ steps.day.outputs.date }}/venues/07
          key: daily-evaluation-07-${{ github.run_id }}
          restore-keys: site-v2-07-${{ steps.day.outputs.date }}-
      - uses: actions/cache/restore@v4
