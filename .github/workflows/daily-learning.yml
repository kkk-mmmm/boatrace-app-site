name: Daily results and history profiles (approved site only)
on:
  workflow_dispatch:
  schedule:
    # Japan 02:10. Only previous calendar days enter history.
    - cron: '10 17 * * *'
permissions:
  contents: read
concurrency:
  group: daily-history-learning
  cancel-in-progress: false
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check publication approval
        id: approval
        run: node site/check-approval.mjs >> "$GITHUB_OUTPUT"
      - name: Choose previous Japan day
        if: steps.approval.outputs.approved == 'true'
        id: day
        run: echo "date=$(TZ=Asia/Tokyo date --date=yesterday +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          path: site/cache/model-history
          key: history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: history-v1-
      - uses: actions/cache/restore@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          path: tools/prediction/model-v2.json
          key: active-model-v2-${{ github.run_id }}
          restore-keys: active-model-v2-
      - uses: actions/cache/restore@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          path: site/cache/${{ steps.day.outputs.date }}
          key: daily-evaluation-01-${{ github.run_id }}
          restore-keys: site-v2-01-${{ steps.day.outputs.date }}-
      - uses: actions/cache/restore@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          path: site/cache/${{ steps.day.outputs.date }}/venues/02
          key: daily-evaluation-02-${{ github.run_id }}
          restore-keys: site-v2-02-${{ steps.day.outputs.date }}-
      - uses: actions/cache/restore@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          path: site/cache/${{ steps.day.outputs.date }}/venues/03
          key: daily-evaluation-03-${{ github.run_id }}
          restore-keys: site-v2-03-${{ steps.day.outputs.date }}-
      - uses: actions/cache/restore@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          path: site/cache/${{ steps.day.outputs.date }}/venues/04
          key: daily-evaluation-04-${{ github.run_id }}
          restore-keys: site-v2-04-${{ steps.day.outputs.date }}-
      - uses: actions/cache/restore@v4
        if: steps.approval.outputs.approved == 'true'
        with:
