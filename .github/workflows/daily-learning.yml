name: Daily rolling-year player profiles and monthly validated coefficient updates
on:
  workflow_dispatch:
    inputs:
      coefficient_only:
        description: Evaluate the existing monthly candidate without exhibition backfill
        type: boolean
        default: false
  schedule:
    # Japan 02:10. Only completed calendar days enter history.
    - cron: '10 17 * * *'
permissions:
  contents: write
  actions: write
  pull-requests: write
concurrency:
  group: daily-history-learning
  cancel-in-progress: false
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check publication approval
        id: approval
        run: node site/check-approval.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          path: site/cache/annual-history
          key: annual-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: annual-history-
      - name: Acquire one archive for each missing completed day
        if: steps.approval.outputs.approved == 'true'
        run: python tools/site/annual_history.py --end "$(TZ=Asia/Tokyo date --date=yesterday +%F)"
      - name: Pair completed exhibition ST and retry bounded recent gaps
        continue-on-error: true
        if: steps.approval.outputs.approved == 'true' && !inputs.coefficient_only
        run: |
          python -B tools/site/test_exhibition_st_history.py
          python tools/site/exhibition_st_history.py --annual-races site/cache/annual-history/races.json --through "$(TZ=Asia/Tokyo date --date=yesterday +%F)"
      - name: Pair retained completed-day prerace inputs with annual history
        if: steps.approval.outputs.approved == 'true'
        run: |
          git fetch origin verification-data
          git worktree add --detach /tmp/boatrace-context-records FETCH_HEAD
          node tools/prediction/enrich_context.mjs site/cache/annual-history /tmp/boatrace-context-records
          python tools/site/course2_escape.py site/cache/annual-history/races.json --through "$(TZ=Asia/Tokyo date --date=yesterday +%F)" --output models/course2-escape/current.json
      - name: Update the last 365 days without daily coefficient fitting
        if: steps.approval.outputs.approved == 'true'
        run: |
          node --test site/test_annual_model.mjs site/test_cloudflare_programs.mjs
          node tools/prediction/update_annual.mjs site/cache/annual-history models/annual/current.json
          cp site/cache/annual-history/manifest.json models/annual/coverage.json
      - name: Fit once per month and adopt only a validated improvement
        if: steps.approval.outputs.approved == 'true'
        run: |
          node --test tools/prediction/test_history_updates.mjs
          node tools/prediction/monthly_candidate.mjs site/cache/annual-history models/monthly-candidates
          node --test tools/prediction/test_monthly_promotion.mjs
          node tools/prediction/promote_monthly.mjs site/cache/annual-history models/monthly-candidates models/annual/current.json site/releases.json
      - name: Save data through a checked PR; never push directly to main
        if: steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add models/annual/current.json models/annual/validation.json models/annual/coverage.json models/exhibition-st/ models/course2-escape/ models/monthly-candidates/ site/releases.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh rolling-year player profiles from completed official results"
          git fetch origin main
          git rebase origin/main
          node site/approve-model-update.mjs
          if ! git diff --quiet -- .github/publication.json; then
            git add .github/publication.json
            git commit -m "Authorize validated monthly coefficient data with unchanged runtime"
          fi
          node site/check-approval.mjs | grep -x approved=true
          python site/merge-data-pr.py
      - name: Publish refreshed data with the approved runtime
        if: steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-pages.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always() && steps.approval.outputs.approved == 'true'
        with:
          name: annual-model-review
          path: |
            models/annual/coverage.json
            models/annual/validation.json
            models/monthly-candidates/
          retention-days: 30
  evaluate-completed:
    needs: learning
    permissions:
      contents: write
    uses: ./.github/workflows/verification-data.yml
    with:
      mode: evaluate
