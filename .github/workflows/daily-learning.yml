name: Daily results and history profiles (approved site only)
on:
  workflow_dispatch:
  schedule:
    # Japan 02:10. Only previous calendar days enter history.
    - cron: '10 17 * * *'
permissions:
  contents: read
concurrency:
  group: daily-history-learning
  cancel-in-progress: false
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check publication approval
        id: approval
        run: node site/check-approval.mjs >> "$GITHUB_OUTPUT"
      - name: Choose previous Japan day
        if: steps.approval.outputs.approved == 'true'
        id: day
        run: echo "date=$(TZ=Asia/Tokyo date --date=yesterday +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          path: site/cache/model-history
          key: history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: history-v1-
      - uses: actions/cache/restore@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          path: tools/prediction/model-v2.json
          key: active-model-v2-${{ github.run_id }}
          restore-keys: active-model-v2-
      - uses: actions/cache/restore@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          path: site/cache/${{ steps.day.outputs.date }}
          key: daily-evaluation-${{ github.run_id }}
          restore-keys: site-live-v3-${{ steps.day.outputs.date }}-
      - name: Acquire completed official results
        if: steps.approval.outputs.approved == 'true'
        run: python tools/site/daily_history.py
      - name: Match genuine saved forecasts and update history profiles
        if: steps.approval.outputs.approved == 'true'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {dailyUpdate} from './tools/prediction/daily.mjs';
          const manifest=JSON.parse(fs.readFileSync('site/cache/model-history/manifest.json'));
          const day=new Date(Date.now()+9*3600000).getUTCDay();
          console.log(dailyUpdate({files:manifest.files,cache:'site/cache',activeFile:'tools/prediction/model-v2.json',output:'site/cache/learning',trainCandidate:day===1}));
          fs.copyFileSync('site/cache/learning/active-model.json','tools/prediction/model-v2.json');
          JS
      - uses: actions/cache/save@v4
        if: steps.approval.outputs.approved == 'true' && success()
        with:
          path: tools/prediction/model-v2.json
          key: active-model-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: steps.approval.outputs.approved == 'true' && success()
        with:
          name: daily-model-review-${{ steps.day.outputs.date }}
          path: |
            site/cache/learning/*.json
            site/cache/model-history/manifest.json
          retention-days: 30
