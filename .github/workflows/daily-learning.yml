name: Daily rolling-year player profiles and monthly coefficient review
on:
  workflow_dispatch:
  schedule:
    # Japan 02:10. Only completed calendar days enter history.
    - cron: '10 17 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: daily-history-learning
  cancel-in-progress: false
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check publication approval
        id: approval
        run: node site/check-approval.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.approval.outputs.approved == 'true'
        with:
          path: site/cache/annual-history
          key: annual-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: annual-history-
      - name: Acquire one archive for each missing completed day
        if: steps.approval.outputs.approved == 'true'
        run: python tools/site/annual_history.py --end "$(TZ=Asia/Tokyo date --date=yesterday +%F)"
      - name: Pair completed exhibition ST and retry bounded recent gaps
        continue-on-error: true
        if: steps.approval.outputs.approved == 'true'
        run: |
          python -B tools/site/test_exhibition_st_history.py
          python tools/site/exhibition_st_history.py --annual-races site/cache/annual-history/races.json --through "$(TZ=Asia/Tokyo date --date=yesterday +%F)"
      - name: Update the last 365 days without daily coefficient fitting
        if: steps.approval.outputs.approved == 'true'
        run: |
          node --test site/test_annual_model.mjs site/test_cloudflare_programs.mjs
          node tools/prediction/update_annual.mjs site/cache/annual-history models/annual/current.json
          cp site/cache/annual-history/manifest.json models/annual/coverage.json
      - name: Fit coefficients once per Japan calendar month, retaining the approved model
        if: steps.approval.outputs.approved == 'true'
        run: |
          node --test tools/prediction/test_history_updates.mjs
          node tools/prediction/monthly_candidate.mjs site/cache/annual-history models/monthly-candidates
      - name: Save data only; publication remains tied to approved code
        if: steps.approval.outputs.approved == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add models/annual/current.json models/annual/coverage.json models/exhibition-st/ models/monthly-candidates/
          git diff --cached --quiet && exit 0
          git commit -m "Refresh rolling-year player profiles from completed official results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Publish refreshed data with the approved runtime
        if: steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-pages.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always() && steps.approval.outputs.approved == 'true'
        with:
          name: annual-model-review
          path: |
            models/annual/coverage.json
            models/annual/validation.json
            models/monthly-candidates/
          retention-days: 30
  evaluate-completed:
    needs: learning
    permissions:
      contents: write
    uses: ./.github/workflows/verification-data.yml
    with:
      mode: evaluate
