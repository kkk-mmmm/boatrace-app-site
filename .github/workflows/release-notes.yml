name: Check append-only release notes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test site/test_releases.mjs
      - run: node site/check-release-notes.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
