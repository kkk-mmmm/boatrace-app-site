name: Refresh and publish approved site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/publication.json]
  schedule:
    # UTC. Japan 08:00-21:59; GitHub schedules are best-effort.
    - cron: '2-57/5 0-12,23 * * *'
permissions:
  contents: read
concurrency:
  group: public-site-production
  cancel-in-progress: false
jobs:
  approval:
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.check.outputs.approved }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: check
        run: node site/check-approval.mjs >> "$GITHUB_OUTPUT"
  collect:
    if: needs.approval.outputs.approved == 'true'
    needs: approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: tools/prediction/model-v2.json
          key: active-model-v2-${{ github.run_id }}
          restore-keys: active-model-v2-
      - name: Choose current Japan day
        id: cache
        run: echo "day=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: site/cache/${{ steps.cache.outputs.day }}
          key: site-live-v3-${{ steps.cache.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-live-v3-${{ steps.cache.outputs.day }}-
      - name: Collect all venues with a shared request limit
        id: collect
        continue-on-error: true
        env:
          BOATRACE_ODDS_API_URL: ${{ vars.BOATRACE_ODDS_API_URL }}
        run: |
          BOATRACE_ODDS_API_URL="$(node site/odds-provider.mjs)"
          export BOATRACE_ODDS_API_URL
          if [ -n "$BOATRACE_ODDS_API_URL" ]; then
            node site/collect-cloudflare.mjs
          else
            python tools/site/collect_all.py
          fi
      - name: Project explicit failure states if the batch was interrupted
        if: steps.collect.outcome != 'success'
        run: |
          for venue in $(seq -w 1 24); do
            node site/snapshot.mjs "$venue" "site/staging/$venue.json" --failed
          done
      - uses: actions/upload-artifact@v4
        with:
          name: venues-current
          path: site/staging/*.json
          retention-days: 1
  publish:
    if: always() && !cancelled() && needs.approval.outputs.approved == 'true'
    needs: [approval, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: venues-current
          path: site/staging
      - name: Validate forecast and freshness behavior
        run: |
          node --test site/test_chart_loading.mjs site/test_strategy_dashboard.mjs tools/prediction/test_conditional_records.mjs tools/prediction/test_strategies.mjs tools/prediction/test_return_filter.mjs site/test_validation_review.mjs site/test_race_metrics.mjs site/test_race_context.mjs site/test_verification_data.mjs site/test_data.mjs site/test_update.mjs site/test_approval.mjs site/test_prediction_view.mjs site/test_live_odds.mjs site/test_annual_model.mjs site/test_cloudflare_programs.mjs site/test_development.mjs tools/prediction/test_history_updates.mjs tools/prediction/test_prospective.mjs
          python -B tools/site/test_probe.py
          python -B tools/site/test_collect_all.py
      - name: Read immutable verification records without changing their branch
        run: |
          git fetch origin verification-data
          git worktree add --detach /tmp/boatrace-public-history FETCH_HEAD
      - name: Build current data or explicit failure state
        env:
          VERIFICATION_DIRECTORY: /tmp/boatrace-public-history
          EVENT_NAME: ${{ github.event_name }}
          BOATRACE_ODDS_API_URL: ${{ vars.BOATRACE_ODDS_API_URL }}
        run: |
          BOATRACE_ODDS_API_URL="$(node site/odds-provider.mjs)"
          export BOATRACE_ODDS_API_URL
          if [ "$EVENT_NAME" = schedule ]; then
            node site/build.mjs --snapshots site/staging
          else
            node site/build.mjs --snapshots site/staging --require-current
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
          retention-days: 1
      - name: Publish approved read-only site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published HTML and data
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json,os,time
          from pathlib import Path
          from urllib.request import urlopen
          from urllib.parse import urljoin
          url=os.environ['SITE_URL']
          brand=json.loads(Path('site/branding.json').read_text())['name']
          for attempt in range(10):
              try:
                  with urlopen(url,timeout=15) as r: html=r.read().decode()
                  with urlopen(urljoin(url,'data/current.json'),timeout=15) as r: data=json.load(r)
                  assert brand in html and data['schema_version']==1 and len(data['venues'])==24
                  assert all(len(v['code'])==2 for v in data['venues'])
                  with urlopen(urljoin(url,'style.css'),timeout=15) as r: assert 'text/css' in r.headers.get('Content-Type','')
                  for code in ('03','24'):
                      with urlopen(urljoin(url,f'data/venues/{code}.json'),timeout=15) as r: assert json.load(r)['venue_code']==code
                  print('Published HTML and current data verified:',url,data['date'],data['update']['status'])
                  break
              except Exception:
                  if attempt==9: raise
                  time.sleep(5)
          PY
  preserve-forecasts:
    needs: [approval, collect]
    if: needs.approval.outputs.approved == 'true'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/verification-data.yml
    with:
      mode: capture
