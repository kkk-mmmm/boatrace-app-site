name: Preserve forecasts and evaluate completed results
run-name: Verification data (${{ inputs.mode || 'hourly' }})
on:
  schedule:
    - cron: '15 * * * *'
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [capture, evaluate, hourly]
        default: capture
permissions:
  contents: write
  actions: write
concurrency:
  group: verification-data-store
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Reusable callers may themselves be scheduled; explicit mode always wins.
      MODE: ${{ inputs.mode || 'hourly' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check immutable record and payout handling
        run: |
          node --test tools/prediction/test_conditional_records.mjs tools/prediction/test_prospective.mjs tools/prediction/test_experiments.mjs tools/prediction/test_hourly_verification.mjs
          python -B tools/site/test_verification_results.py
      - name: Check approved runtime
        run: node site/check-approval.mjs | grep -x approved=true
      - name: Open independent durable records branch
        run: |
          git fetch origin verification-data
          git worktree add --detach /tmp/boatrace-verification FETCH_HEAD
      - uses: actions/download-artifact@v4
        if: env.MODE == 'capture' && github.event_name != 'workflow_dispatch'
        with:
          name: venues-current
          path: site/staging
      - name: Capture current Worker data on explicit manual run
        if: env.MODE == 'capture' && github.event_name == 'workflow_dispatch'
        run: |
          export BOATRACE_ODDS_API_URL="$(node site/odds-provider.mjs)"
          node site/collect-cloudflare.mjs
      - uses: actions/cache/restore@v4
        if: env.MODE == 'evaluate'
        with:
          path: site/cache/annual-history
          key: annual-history-verification-${{ github.run_id }}
          restore-keys: annual-history-
      - name: Preserve observations or match completed official results
        run: |
          if [ "$MODE" = capture ]; then
            node tools/prediction/prospective.mjs capture site/staging /tmp/boatrace-verification
            node tools/prediction/experiments.mjs capture /tmp/boatrace-verification site/experiments.json site/staging
          elif [ "$MODE" = evaluate ]; then
            python tools/site/verification_results.py --verification-directory /tmp/boatrace-verification
            mkdir -p /tmp/boatrace-verification/results
            node tools/prediction/prospective.mjs evaluate /tmp/boatrace-verification /tmp/boatrace-verification/results
            node tools/prediction/experiments.mjs finalize /tmp/boatrace-verification site/experiments.json
          elif [ "$MODE" = hourly ]; then
            node tools/prediction/hourly_verification.mjs /tmp/boatrace-verification site/experiments.json
          else
            echo 'Unknown evaluation mode'
            exit 1
          fi
      - name: Preserve all conditional tickets and reconcile their returns
        run: node tools/prediction/conditional_records.mjs /tmp/boatrace-verification site/conditional-strategies.json site/staging
      - name: Commit new records without overwriting earlier observations
        id: store
        run: |
          cd /tmp/boatrace-verification
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Preserve immutable forecasts and verified race results'
          git push origin HEAD:verification-data
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish only after new result records have been saved
        if: env.MODE != 'capture' && steps.store.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-pages.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-review-${{ env.MODE }}
          path: /tmp/boatrace-verification/reports/
          if-no-files-found: ignore
          retention-days: 30
