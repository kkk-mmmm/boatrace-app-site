name: Verify the published site in Chromium
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-site-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check public HTML, all venue data and browser behavior
        env:
          SITE_VERIFY_OUTPUT: /tmp/boatrace-public-check
        run: |
          browser_bin=$(command -v google-chrome || command -v chromium)
          "$browser_bin" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/boatrace-public-browser > /tmp/boatrace-public-browser.log 2>&1 &
          browser_pid=$!
          trap 'kill "$browser_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:9222/json/version > /dev/null; then break; fi
            sleep 1
          done
          node site/verify-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-site-verification
          path: /tmp/boatrace-public-check/
          retention-days: 7
