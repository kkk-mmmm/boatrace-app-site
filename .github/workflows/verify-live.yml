name: Verify the published site in Chromium
on:
  workflow_dispatch:
    inputs:
      transport_only:
        description: Check official HTTPS connection reuse before publication
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: published-site-verification
  cancel-in-progress: true
jobs:
  transport:
    if: inputs.transport_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Test transport and measure two serial requests
        run: |
          python -B tools/site/test_probe.py
          python - <<'PY'
          import sys,time
          sys.path.insert(0,'tools/site')
          from probe_official import fetch,ORIGIN,TRANSPORT
          previous=None
          for attempt in range(2):
              started=time.monotonic()
              text,headers=fetch(ORIGIN+'/robots.txt')
              connection=getattr(TRANSPORT,'connection',None)
              print({'attempt':attempt+1,'seconds':round(time.monotonic()-started,3),'reused':connection is not None and connection is previous,'bytes':len(text)},flush=True)
              previous=connection
              time.sleep(1)
          PY
  verify:
    if: ${{ !inputs.transport_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check public HTML, all venue data and browser behavior
        env:
          SITE_VERIFY_OUTPUT: /tmp/boatrace-public-check
        run: |
          browser_bin=$(command -v google-chrome || command -v chromium)
          "$browser_bin" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/boatrace-public-browser > /tmp/boatrace-public-browser.log 2>&1 &
          browser_pid=$!
          trap 'kill "$browser_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:9222/json/version > /dev/null; then break; fi
            sleep 1
          done
          node site/verify-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-site-verification
          path: /tmp/boatrace-public-check/
          retention-days: 7
